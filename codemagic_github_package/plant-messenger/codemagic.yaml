# Codemagic — PLANT iOS
# Перед сборкой: подключите Apple Developer в Codemagic (см. ИНСТРУКЦИЯ_CODEMAGIC.txt)

workflows:
  plant-ios-ipa:
    name: PLANT — сборка IPA (iPhone)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      ios_signing:
        distribution_type: development
        bundle_identifier: com.plant.messenger

    scripts:
      - name: Зависимости Flutter
        script: flutter pub get

      - name: Тесты
        script: flutter test

      - name: Настройка подписи iOS
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "com.plant.messenger" \
            --type IOS_APP_DEVELOPMENT \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: CocoaPods
        script: |
          cd ios
          pod install

      - name: Сборка IPA
        script: flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      email:
        recipients:
          - user@example.com
        notify:
          success: true
          failure: true
